name: Update conference data

on:
  schedule:
    - cron: '0 3 * * 0'   # every Sunday at 03:00 UTC
  workflow_dispatch:        # manual trigger (refresh button)

permissions:
  contents: write
  packages: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx beautifulsoup4 lxml pyyaml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pull the latest design system (not limited by the semver range in package.json)
      # and refresh the copy GitHub Pages serves.
      - name: Update design system
        run: |
          npm install --save-dev @johmara/design-system@latest
          npm run vendor
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate data.json
        run: python generate_data.py
        env:
          YEAR_RANGE: 5

      - name: Generate calendar and Atom feeds
        run: python generate_feeds.py

      - name: Commit updated data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json feeds package.json package-lock.json vendor assets
          git diff --cached --quiet || git commit -m "chore: refresh conference data and design system $(date -u +%Y-%m-%d)"
          git push
